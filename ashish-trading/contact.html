<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Location | Ashish Trading Company</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#ea580c',
                            600: '#c2410c',
                            900: '#111827',
                            950: '#030712',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        heading: ['Oswald', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .map-placeholder {
            background-image: url('https://loremflickr.com/1200/800/map,streets');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">
    
    <!-- Header -->
    <header class="bg-brand-950 text-white sticky top-0 z-50 border-b-4 border-brand-500">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-brand-500 w-10 h-10 flex items-center justify-center font-heading text-2xl font-bold rounded-sm">AT</div>
                <div>
                    <h1 class="text-2xl font-heading tracking-wider m-0 leading-none">Ashish Trading</h1>
                </div>
            </a>
            
            <nav class="hidden md:flex gap-8">
                <a href="index.html" class="text-gray-300 font-medium hover:text-brand-500 transition-colors">Home</a>
                <a href="about.html" class="text-gray-300 font-medium hover:text-brand-500 transition-colors">About</a>
                <a href="products.html" class="text-gray-300 font-medium hover:text-brand-500 transition-colors">Products</a>
                <a href="contact.html" class="text-brand-500 font-medium hover:text-white transition-colors">Contact</a>
            </nav>
            
            <div class="hidden lg:flex items-center gap-3">
                <div class="text-right">
                    <p class="text-xs text-gray-400 uppercase">Call for Bulk Orders</p>
                    <p class="font-heading text-lg text-brand-500">+91 62042 68282</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col lg:flex-row">
        
        <!-- Contact Form & Info -->
        <div class="lg:w-1/2 p-8 md:p-16 xl:p-24 bg-white z-10 shadow-2xl">
            <h3 class="text-brand-500 font-bold tracking-widest text-sm mb-2">OPERATIONS CENTER</h3>
            <h1 class="text-5xl font-heading font-bold text-brand-900 mb-10">INITIATE DISPATCH.</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                <div class="bg-gray-50 p-6 border-l-4 border-brand-900">
                    <svg class="w-8 h-8 text-brand-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    <h4 class="font-heading text-lg text-brand-950 mb-1">Direct Line</h4>
                    <p class="text-2xl font-bold text-brand-500">+91 62042 68282</p>
                </div>
                <div class="bg-gray-50 p-6 border-l-4 border-brand-900">
                    <svg class="w-8 h-8 text-brand-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <h4 class="font-heading text-lg text-brand-950 mb-1">Warehouse Location</h4>
                    <p class="text-sm text-gray-600">Wholesale Market Area,<br>Bhagalpur, Bihar 812001</p>
                </div>
            </div>

            <form class="space-y-6">
                <div>
                    <h4 class="font-heading text-2xl text-brand-900 mb-6 border-b-2 border-gray-100 pb-2">REQUEST A QUOTE</h4>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Company/Name</label>
                        <input type="text" class="w-full bg-gray-100 border-2 border-transparent focus:border-brand-500 focus:bg-white focus:outline-none p-4 rounded-none transition-colors" placeholder="Enter business name">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Contact Number</label>
                        <input type="tel" class="w-full bg-gray-100 border-2 border-transparent focus:border-brand-500 focus:bg-white focus:outline-none p-4 rounded-none transition-colors" placeholder="+91">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Department of Interest</label>
                    <select class="w-full bg-gray-100 border-2 border-transparent focus:border-brand-500 focus:bg-white focus:outline-none p-4 rounded-none transition-colors appearance-none cursor-pointer">
                        <option>Hardware & Tools</option>
                        <option>Electrical Supplies</option>
                        <option>Construction Materials</option>
                        <option>Mixed Bulk Order</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Order Details</label>
                    <textarea rows="4" class="w-full bg-gray-100 border-2 border-transparent focus:border-brand-500 focus:bg-white focus:outline-none p-4 rounded-none transition-colors resize-none" placeholder="Specify quantities and items..."></textarea>
                </div>
                <button type="button" class="w-full bg-brand-950 hover:bg-brand-500 text-white font-heading text-xl tracking-widest py-5 uppercase transition-colors">Submit Request</button>
            </form>
        </div>
        
        <!-- Map Visual -->
        <div class="lg:w-1/2 min-h-[500px] lg:min-h-full map-placeholder relative grayscale hover:grayscale-0 transition-all duration-1000 border-t-8 lg:border-t-0 lg:border-l-8 border-brand-500">
            <div class="absolute inset-0 bg-brand-900/40 hover:bg-transparent transition-colors duration-1000"></div>
            <!-- Marker Pin -->
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
                <div class="bg-brand-500 text-white font-bold px-4 py-2 text-sm shadow-xl whitespace-nowrap mb-2 font-heading tracking-wider">ASHISH TRADING CO.</div>
                <div class="w-6 h-6 bg-brand-900 rounded-full border-4 border-white shadow-2xl z-10 relative">
                    <div class="absolute inset-0 bg-brand-500 rounded-full animate-ping opacity-75"></div>
                </div>
                <div class="w-1 h-12 bg-gradient-to-b from-brand-900 to-transparent"></div>
            </div>
        </div>
        
    </main>
</body>
</html>
